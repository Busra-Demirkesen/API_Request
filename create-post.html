<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/b40438d37d.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="style.css" />
    <title>Create New Post</title>

    <div class="container">
      <div class="create-post">
        <h2>Create a new Post</h2>
        <form id="postForm">
          <input
            type="text"
            id="post-title"
            name="title"
            placeholder="Post Title"
            required
          />
          <textarea
            id="post-body"
            name="body"
            placeholder="Post Content"
            required
          ></textarea>
          <button type="submit" id="create-post-button">Create Post</button>

          <div id="error-message"></div>
          <div id="success-message"></div>
        </form>

        <button id="back-to-home"><i class="fa-solid fa-left-long"></i></button>
      </div>
    </div>
  </head>
  <body>
    <script src="create-post.js"></script>
  </body>
</html>
